{% extends "base.html" %}
{% block title %}Realtor Information Request — Hutton{% endblock %}
{% block content %}
<h1>Realtor information request</h1>
<p class="subtitle">Request strata documents for a real estate transaction, including Form B.</p>
<div class="card"><form method="post">
  <div class="form-row">
    <div class="form-group"><label>Realtor name</label><input type="text" name="name" required /></div>
    <div class="form-group"><label>Brokerage</label><input type="text" name="brokerage" required /></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Email address</label><input type="email" name="email" required /></div>
    <div class="form-group"><label>Phone number</label><input type="tel" name="phone" required /></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Strata lot / Unit number</label><input type="text" name="unit" required /></div>
    <div class="form-group"><label>Strata plan number</label><input type="text" name="strata_plan" /></div>
  </div>
  <div class="form-group"><label>Building / Strata corporation</label><input type="text" name="building" required /></div>
  <div class="form-group"><label>Documents required</label>
    <select name="documents">
      <option value="form_b">Form B — Information Certificate</option>
      <option value="minutes">Meeting minutes (last 2 years)</option>
      <option value="financials">Financial statements</option>
      <option value="all">All of the above</option>
      <option value="other">Other — specify below</option>
    </select>
  </div>
  <div class="form-group"><label>Date required by</label><input type="date" name="required_by" /></div>
  <div class="form-group"><label>Additional notes</label><textarea name="notes" placeholder="Optional — specify any other documents or instructions"></textarea></div>
  <button type="submit" class="btn-submit">Submit request</button>
</form></div>
{% endblock %}
