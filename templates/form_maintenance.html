{% extends "base.html" %}
{% block title %}Maintenance Request — Hutton{% endblock %}
{% block content %}
<h1>Maintenance request</h1>
<p class="subtitle">Submit a repair or maintenance request for your strata unit or common areas.</p>
<div class="card"><form method="post">
  <div class="form-row">
    <div class="form-group"><label>Your name</label><input type="text" name="name" required /></div>
    <div class="form-group"><label>Unit number</label><input type="text" name="unit" required /></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Email address</label><input type="email" name="email" required /></div>
    <div class="form-group"><label>Phone number</label><input type="tel" name="phone" /></div>
  </div>
  <div class="form-group"><label>Building / Strata corporation</label><input type="text" name="building" required /></div>
  <div class="form-group"><label>Description of issue</label><textarea name="description" required placeholder="Describe the problem in as much detail as possible"></textarea></div>
  <div class="form-group"><label>Location (e.g. Unit, Hallway, Parkade)</label><input type="text" name="location" required /></div>
  <div class="form-group">
    <label>Urgency</label>
    <select name="urgency">
      <option value="routine">Routine — not urgent</option>
      <option value="soon">Soon — within a few days</option>
      <option value="urgent">Urgent — requires prompt attention</option>
      <option value="emergency">Emergency — immediate danger or damage</option>
    </select>
  </div>
  <div class="form-group"><label>Best time to contact</label><input type="text" name="contact_time" placeholder="e.g. Weekday mornings" /></div>
  <button type="submit" class="btn-submit">Submit request</button>
</form></div>
{% endblock %}
