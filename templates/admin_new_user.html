{% extends "base.html" %}
{% block title %}New User — Hutton Client Portal{% endblock %}
{% block content %}

<div style="max-width:520px; margin:0 auto;">
  <div class="page-header">
    <h1>New User</h1>
    <a href="{{ url_for('admin_users') }}" class="btn btn-outline">← Back</a>
  </div>

  <div class="card">
    <form method="post">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" onchange="toggleBuildings(this.value)">
          <option value="viewer">Viewer — strata owner/resident</option>
          <option value="contractor">Contractor — can post work notices only</option>
          <option value="editor">Editor — can upload &amp; view all</option>
          <option value="admin">Admin — full access</option>
        </select>
      </div>

      <div class="form-group" id="buildings-section">
        <label>Assign to Buildings <span style="font-weight:400; color:var(--muted);">(select all that apply)</span></label>
        {% if buildings %}
        <div style="border:1px solid var(--border); border-radius:var(--radius); max-height:220px; overflow-y:auto; padding:8px 12px;">
          {% for b in buildings %}
          <label style="display:flex; align-items:center; gap:8px; padding:5px 0; font-weight:400; cursor:pointer;">
            <input type="checkbox" name="building_ids" value="{{ b.id }}" />
            <span>{{ b.name }}{% if b.address %} <span style="color:var(--muted); font-size:.85rem;">— {{ b.address }}</span>{% endif %}</span>
          </label>
          {% endfor %}
        </div>
        {% else %}
        <p style="font-size:.85rem; color:var(--muted);">No buildings added yet. <a href="{{ url_for('admin_new_building') }}">Add buildings first.</a></p>
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary">Create User</button>
    </form>
  </div>
</div>

<script>
function toggleBuildings(role) {
  document.getElementById('buildings-section').style.display =
    (role === 'viewer' || role === 'contractor') ? 'block' : 'none';
}
toggleBuildings(document.getElementById('role').value);
</script>

{% endblock %}
