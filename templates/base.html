<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}Hutton{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f5f5f7; color: #1d1d1f; font-family: 'PT Serif', Georgia, serif; -webkit-font-smoothing: antialiased; min-height: 100%; }

    nav {
      background: rgba(245,245,247,0.92);
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .nav-inner {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav img { height: 20px; filter: brightness(0); }
    nav .wordmark { display: none; font-size: .95rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1d1d1f; text-decoration: none; }
    nav a { text-decoration: none; }
    .nav-back {
      font-size: .8rem;
      color: #6e6e73;
      padding: 5px 14px;
      border: 0.5px solid rgba(0,0,0,0.15);
      border-radius: 980px;
      transition: background .15s, color .15s;
    }
    .nav-back:hover { background: #e8e8ed; color: #1d1d1f; }

    .page-wrap { max-width: 860px; margin: 0 auto; padding: 48px 28px 80px; }

    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 700; color: #1d1d1f; letter-spacing: -.03em; margin-bottom: 10px; }
    .subtitle { font-size: .95rem; color: #6e6e73; line-height: 1.6; margin-bottom: 40px; max-width: 560px; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 32px;
      margin-bottom: 16px;
      border: 0.5px solid rgba(0,0,0,0.06);
    }

    .flash-success { font-size: .875rem; color: #3a3a3c; background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; border: 0.5px solid rgba(0,0,0,0.08); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
    @media (max-width: 540px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 24px; }
    label { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: #8e8e93; margin-bottom: 8px; }
    input[type="text"], input[type="email"], input[type="tel"],
    input[type="date"], select, textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #d1d1d6;
      padding: 10px 0;
      font-family: 'PT Serif', Georgia, serif;
      font-size: .95rem;
      color: #1d1d1f;
      background: transparent;
      outline: none;
      transition: border-color .2s;
      border-radius: 0;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #1d1d1f; }
    input::placeholder, textarea::placeholder { color: #c7c7cc; }
    textarea { resize: vertical; min-height: 96px; }

    .btn-submit {
      background: #1d1d1f;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-family: 'PT Serif', Georgia, serif;
      font-size: .875rem;
      border-radius: 980px;
      cursor: pointer;
      letter-spacing: .02em;
      transition: opacity .2s;
      margin-top: 8px;
    }
    .btn-submit:hover { opacity: .72; }

    hr { border: none; border-top: 0.5px solid #e5e5ea; margin: 32px 0; }

    .prose p { font-size: .95rem; color: #3a3a3c; line-height: 1.75; margin-bottom: 14px; }
    .prose ul { padding-left: 18px; margin-bottom: 18px; }
    .prose ul li { font-size: .9rem; color: #3a3a3c; line-height: 1.7; margin-bottom: 5px; }
    .prose h3 { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8e8e93; margin: 28px 0 12px; }
    .prose a { color: #1d1d1f; }

    .faq-item { border-bottom: 0.5px solid #e5e5ea; padding: 18px 0; }
    .faq-item:first-child { border-top: 0.5px solid #e5e5ea; }
    .faq-q { font-size: .95rem; font-weight: 700; color: #1d1d1f; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; -webkit-tap-highlight-color: transparent; user-select: none; }
    .faq-q .icon { color: #8e8e93; font-weight: 300; font-size: 1.2rem; line-height: 1; flex-shrink: 0; transition: transform .2s; }
    .faq-a { font-size: .9rem; color: #6e6e73; line-height: 1.7; margin-top: 10px; display: none; }
    .faq-item.open .faq-a { display: block; }
    .faq-item.open .faq-q .icon { transform: rotate(45deg); }

    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 540px) { .contact-grid { grid-template-columns: 1fr; } }
    .contact-block { background: #fff; border-radius: 14px; padding: 20px 22px; border: 0.5px solid rgba(0,0,0,0.06); }
    .contact-block .clabel { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: #8e8e93; margin-bottom: 8px; }
    .contact-block .cvalue { font-size: .95rem; color: #1d1d1f; line-height: 1.6; }
    .contact-block a { color: #1d1d1f; text-decoration: none; border-bottom: 1px solid #d1d1d6; padding-bottom: 1px; }

    .notice {
      font-size: .82rem;
      color: #6e6e73;
      border-left: 2px solid #d1d1d6;
      padding-left: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    footer {
      border-top: 0.5px solid #e5e5ea;
      padding: 20px 28px;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .72rem;
      color: #8e8e93;
      flex-wrap: wrap;
      gap: 8px;
    }
    footer a { color: #8e8e93; text-decoration: none; }
    footer a:hover { color: #1d1d1f; }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/">
      <img src="https://huttonpropertymanagement.com/wp-content/uploads/Hutton-Word-Smaller.png"
           alt="Hutton"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
      <span class="wordmark">Hutton</span>
    </a>
    <a href="/" class="nav-back">← Home</a>
  </div>
</nav>

<div class="page-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<footer>
  <span>Hutton &nbsp;·&nbsp; Victoria, B.C. &nbsp;·&nbsp; (250) 598-5148</span>
  <span>
    <a href="/contact">Contact</a> &nbsp;·&nbsp;
    <a href="/services">Services</a> &nbsp;·&nbsp;
    <a href="/faq">FAQ</a> &nbsp;·&nbsp;
    <a href="/portal">Staff login</a>
  </span>
</footer>

<script>
document.querySelectorAll('.faq-q').forEach(q => {
  q.addEventListener('click', () => q.parentElement.classList.toggle('open'));
});
</script>
</body>
</html>
