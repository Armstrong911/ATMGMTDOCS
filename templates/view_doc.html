{% extends "base.html" %}
{% block title %}{{ doc.title }} — DocHost{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ doc.title }}</h1>
  <div style="display:flex; gap:8px;">
    <a href="{{ url_for('download_doc', doc_id=doc.id) }}" class="btn btn-primary btn-sm">⬇ Download</a>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline btn-sm">← Back</a>
  </div>
</div>

{% if doc.description %}
<p style="margin-bottom:16px; color:var(--muted); font-size:.9rem;">{{ doc.description }}</p>
{% endif %}

<div class="card" style="padding:0; overflow:hidden;">
  <iframe
    src="{{ url_for('serve_doc', doc_id=doc.id) }}"
    style="width:100%; height:80vh; border:none; display:block;"
    title="{{ doc.title }}"
  ></iframe>
</div>

{% endblock %}
