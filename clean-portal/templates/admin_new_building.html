{% extends "base.html" %}
{% block title %}New Building — Hutton Client Portal{% endblock %}
{% block content %}

<div style="max-width:480px; margin:0 auto;">
  <div class="page-header">
    <h1>New Building</h1>
    <a href="{{ url_for('admin_buildings') }}" class="btn btn-outline">← Back</a>
  </div>

  <div class="card">
    <form method="post">
      <div class="form-group">
        <label for="name">Building Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Harbour View Estates" />
      </div>
      <div class="form-group">
        <label for="address">Street Address</label>
        <input type="text" id="address" name="address" placeholder="e.g. 123 Cook St, Victoria, BC" />
      </div>
      <button type="submit" class="btn btn-primary">Add Building</button>
    </form>
  </div>
</div>

{% endblock %}
